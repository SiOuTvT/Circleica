# Prometheus 配置
# 抓取对象：
#   - 自身
#   - otel-collector 暴露的 /metrics（含应用经 OTLP 推送的指标 + 主机资源指标）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
