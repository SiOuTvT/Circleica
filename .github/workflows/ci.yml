name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 质量门禁：每次 PR 自动跑，无需运行时环境 ──
  quality:
    name: Lint / Typecheck / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  # ── 生产构建：CI 仅验证「能构建」，不连生产库 ──
  # 说明：DATABASE_URL 仅在 next build 期页面回源数据库时才需要。
  #   - CI 用本地占位串兜底即可验证「无 DB 依赖的构建」；
  #   - 真实生产 DATABASE_URL 只在「部署作业（deploy job / GitHub Environment 受保护环境）」注入，
  #     切勿把生产库连接串放进普通 PR CI 的 Secrets（避免测试污染/误连生产库）。
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      # 本地占位串：CI 构建兜底，不会连任何真实数据库
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://circleica:circleica@localhost:5432/circleica' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        run: npm run build

  # ── 端到端：内置 Postgres 服务 + Playwright，验证关键链路 ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: circleica
          POSTGRES_PASSWORD: circleica
          POSTGRES_DB: circleica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circleica"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://circleica:circleica@localhost:5432/circleica
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # 可选、非机密：仅用于「验证带监控的构建链路」。缺省时代码自动降级为无监控（不影响业务）。
      # 不要在此注入生产 SENTRY_DSN / OTEL 端点——CI 只需验证降级路径与基础链路；
      # 生产真实值只在「部署作业 / GitHub Environment 受保护环境」注入。
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate + migrate
        run: npx prisma generate && npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start server
        run: npm run start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 120000
      - name: E2E tests
        run: npm run test:e2e
