# ═══════════════════════════════════════════
# Circleica 生产环境 Docker Compose
# ═══════════════════════════════════════════
#
# 首次部署:
#   docker compose up -d
#   docker compose run --rm migrate   # 执行数据库迁移
#
# 后续更新:
#   docker compose build
#   docker compose run --rm migrate   # 执行迁移（如有新迁移文件）
#   docker compose up -d
#
# Coolify 部署:
#   自动使用此文件，migrate 需手动触发或通过 Coolify 命令执行

services:
  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: circleica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: circleica
      POSTGRES_PASSWORD: circleica
      POSTGRES_DB: circleica
      PGPASSWORD: circleica
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circleica -d circleica && psql -U circleica -d circleica -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - circleica

  # ── 数据库迁移（独立运行，不随 app 启动）────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/migrate-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
    networks:
      - circleica
    profiles:
      - migrate

  # ── Galvelica 资料馆填充（一次性，可选）────
  # 复用 builder 构建阶段（含全量源码 + tsx），不污染生产运行镜像。
  # 用法：docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    entrypoint: ["/ingest-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
      CNGL_API_TOKEN: ${CNGL_API_TOKEN:-}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      GALVELICA_DOUJIN_ONLY: ${GALVELICA_DOUJIN_ONLY:-1}
      GALVELICA_KEEP_RAW: ${GALVELICA_KEEP_RAW:-0}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    networks:
      - circleica
    profiles:
      - ingest

  # ── Circleica 应用 ────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: circleica-app
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      PORT: "3000"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - circleica

  # ── 数据库备份（每天凌晨 3 点，保留 7 天）────
  backup:
    image: postgres:16-alpine
    container_name: circleica-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: circleica
    volumes:
      - backup_data:/backups
    entrypoint: >
      sh -c '
      echo "0 3 * * * pg_dump -h db -U circleica circleica | gzip > /backups/circleica-$$(date +\%Y\%m\%d-\%H\%M\%S).sql.gz && find /backups -name \"circleica-*.sql.gz\" -mtime +7 -delete" | crontab -
      crond -f -l 2
      '
    networks:
      - circleica

networks:
  circleica:

volumes:
  pg_data:
  uploads_data:
  backup_data:
