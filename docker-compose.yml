# ═══════════════════════════════════════════
# Circleica 生产环境 Docker Compose
# ═══════════════════════════════════════════
#
# 首次部署:
#   docker compose up -d
#   docker compose run --rm migrate   # 执行数据库迁移
#
# 后续更新:
#   docker compose build
#   docker compose run --rm migrate   # 执行迁移（如有新迁移文件）
#   docker compose up -d
#
# Coolify 部署:
#   自动使用此文件，migrate 需手动触发或通过 Coolify 命令执行

services:
  # ── PostgreSQL ──────────────────────────────
  # ⚠️ 安全警告：默认口令 circleica 仅为本地/测试便捷。
  #    任何非纯本地的部署必须注入强口令：
  #    docker compose up -d -e POSTGRES_PASSWORD=<强随机口令> -e DATABASE_URL=postgresql://circleica:<强随机口令>@db:5432/circleica
  #    （或通过 .env 提供 POSTGRES_PASSWORD / DATABASE_URL）
  db:
    image: postgres:16-alpine
    container_name: circleica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circleica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circleica}
      POSTGRES_DB: ${POSTGRES_DB:-circleica}
      PGPASSWORD: ${POSTGRES_PASSWORD:-circleica}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circleica -d circleica && psql -U circleica -d circleica -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - circleica

  # ── 数据库迁移（独立运行，不随 app 启动）────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/migrate-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
    networks:
      - circleica
    profiles:
      - migrate

  # ── Galvelica 资料馆填充（一次性，可选）────
  # 复用 builder 构建阶段（含全量源码 + tsx），不污染生产运行镜像。
  # 用法：docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    entrypoint: ["/ingest-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
      CNGL_API_TOKEN: ${CNGL_API_TOKEN:-}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      GALVELICA_DOUJIN_ONLY: ${GALVELICA_DOUJIN_ONLY:-1}
      GALVELICA_KEEP_RAW: ${GALVELICA_KEEP_RAW:-0}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    networks:
      - circleica
    profiles:
      - ingest

  # ── Circleica 应用 ────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # NEXT_PUBLIC_* 必须在构建期注入（Next.js 会把它内联进浏览器 bundle），
        # 运行时再给已经来不及，浏览器侧拿到的会是 undefined。
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # 以下三个仅用于构建期上传 sourcemap，不进 runner 镜像层。
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: circleica-app
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://circleica:circleica@db:5432/circleica}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      PORT: "3000"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # 服务端 / Edge 运行时上报用；客户端用 NEXT_PUBLIC_SENTRY_DSN（构建期已内联，
      # 这里再给一份是为了 instrumentation.ts 的启用判断能读到统一值）。
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      # SENTRY_AUTH_TOKEN 只在构建期上传 sourcemap 用，运行时无需持有 → 不注入容器。
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period 必须覆盖「启动 + 迁移」最坏耗时。此前 30s 窄于迁移最坏路径（约 366s），
      # 首次部署/大迁移时容器会在还没起来时就被判 unhealthy 触发回滚。留到 420s。
      start_period: 420s
    networks:
      - circleica

  # ── 数据库备份（每天凌晨 3 点，保留 7 天）────
  backup:
    image: postgres:16-alpine
    container_name: circleica-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: circleica
    volumes:
      - backup_data:/backups
    entrypoint: >
      sh -c '
      echo "0 3 * * * pg_dump -h db -U circleica circleica | gzip > /backups/circleica-$$(date +\%Y\%m\%d-\%H\%M\%S).sql.gz && find /backups -name \"circleica-*.sql.gz\" -mtime +7 -delete" | crontab -
      crond -f -l 2
      '
    networks:
      - circleica

networks:
  circleica:

volumes:
  pg_data:
  uploads_data:
  backup_data:
